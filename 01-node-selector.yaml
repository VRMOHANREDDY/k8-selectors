apiVersion: v1                      # Core API version, where Pod objects live
kind: Pod                           # Creating a single Pod directly (no Deployment managing it)
metadata:                           # Identifying info about the Pod
  name: nginx                       # Pod name
  labels:                           # Labels on the Pod itself (used by Services, selectors, filtering)
    project: roboshop               # Belongs to the roboshop project
    environment: dev                # Running in the dev environment
    purpose: poc                    # Proof of concept / testing pod
spec:                               # Desired state of the Pod
  containers:                       # List of containers in the Pod
  - name: nginx                     # Container name
    image: nginx                    # nginx image, pulled from Docker Hub by default (latest tag)
  nodeSelector:                     # Run this Pod only on nodes that have ALL the labels below
    project: roboshop               # The node must carry the label project=roboshop